services:
  mariadb:
    build: ./requirements/mariadb/
    container_name: mariadb
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    secrets:
      - mariadb_wp_user_password
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
  wordpress:
    build: ./requirements/wordpress/
    secrets:
      - wp_admin_name
      - wp_admin_password
      - wp_admin_mail
      - wp_user_name
      - wp_user_password
      - wp_user_mail
      - mariadb_wp_user_password
    container_name: wordpress
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    healthcheck:
      test: ["CMD", "cgi-fcgi", "-bind", "-connect", "localhost:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
        - "9000:9000"
  nginx:
    build: ./requirements/nginx/
    container_name: nginx
    env_file: .env
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "https://localhost:443", "-k"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    ports:
      - "443:443"
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/billcipher/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/billcipher/data/wordpress

networks:
  inception:
    driver: bridge
  
secrets:
  wp_admin_name:
    file: ../secrets/wordpress/wp_admin_name.txt
  wp_admin_password:
    file: ../secrets/wordpress/wp_admin_password.txt
  wp_admin_mail:
    file: ../secrets/wordpress/wp_admin_mail.txt
  wp_user_name:
    file: ../secrets/wordpress/wp_user_name.txt
  wp_user_password:
    file: ../secrets/wordpress/wp_user_password.txt
  wp_user_mail:
    file: ../secrets/wordpress/wp_user_mail.txt
  mariadb_wp_user_password:
    file: ../secrets/mariadb/mariadb_wp_user_password.txt