services:
  mariadb:
    build: ./requirements/mariadb/
    container_name: mariadb
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    secrets:
      - mariadb_wp_user_password
  wordpress:
    build: ./requirements/wordpress/
    secrets:
      - wp_admin_name
      - wp_admin_password
      - wp_admin_mail
      - wp_user_name
      - wp_user_password
      - wp_user_mail
      - mariadb_wp_user_password
    container_name: wordpress
    env_file: .env
    depends_on:
      - mariadb
    volumes:
      - wp_data:/var/www/html
    ports:
        - "9000:9000"
  nginx:
    build: ./requirements/nginx/
    container_name: nginx
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
    ports:
      - "443:443"
volumes:
  db_data:
  wp_data:

secrets:
  wp_admin_name:
    file: ../secrets/wp_admin_name.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_admin_mail:
    file: ../secrets/wp_admin_mail.txt
  wp_user_name:
    file: ../secrets/wp_user_name.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_user_mail:
    file: ../secrets/wp_user_mail.txt
  mariadb_wp_user_password:
    file: ../secrets/mariadb_wp_user_password.txt